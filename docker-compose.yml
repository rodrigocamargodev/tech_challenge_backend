services:
  # Serviço 1: O Servidor Node.js do Blog
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tech_blog_api
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MONGO_URI=mongodb://mongodb:27017/tech_challenge_blog
      # Defina JWT_SECRET no arquivo .env (nunca versione o valor real)
      - JWT_SECRET=${JWT_SECRET:?Defina JWT_SECRET no arquivo .env}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-8h}
      - BCRYPT_SALT_ROUNDS=${BCRYPT_SALT_ROUNDS:-12}
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
    depends_on:
      mongodb:
        condition: service_healthy

  # Serviço 2: O Banco de Dados MongoDB
  mongodb:
    image: mongo:7
    container_name: tech_blog_db
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  mongo_data: