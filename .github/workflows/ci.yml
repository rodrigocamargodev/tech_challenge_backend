name: CI - Tech Challenge Pipeline

# Define quais eventos disparam a automação
on:
  push:
    branches: ["main", "master", "develop"]
  pull_request:
    branches: ["main", "master", "develop"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      JWT_SECRET: segredo-de-ci-nao-usar-em-producao
      JWT_EXPIRES_IN: 8h
      BCRYPT_SALT_ROUNDS: "4"
      CORS_ORIGIN: "*"

    steps:
      # 1. Baixa o código do repositório para a máquina virtual do GitHub
      - name: Checkout repository code
        uses: actions/checkout@v4

      # 2. Configura a versão do Node.js ambiente
      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # 3. Instala todas as dependências listadas no package.json
      - name: Install dependencies
        run: npm ci

      # 4. Verifica a tipagem de src e tests
      - name: Typecheck (src + tests)
        run: npm run typecheck

      # 5. Verifica se o TypeScript compila com sucesso para JavaScript
      - name: Verify TypeScript Compilation (Build)
        run: npm run build

      # 6. Executa os testes automatizados e gera o relatório de cobertura
      - name: Run Tests
        run: npm test

      # 7. Publica o relatório de cobertura como artefato
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7